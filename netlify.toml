# Netlify configuration for Master Chef (static site + serverless functions).
# Frontend auto-deploys from GitHub on push to main.

[build]
  publish = "."

[build.environment]
  # PB_EMAIL is the super-admin's email — it must appear in a migration (to flag
  # the super-admin) and in docs, and an email isn't a sensitive secret, so exclude
  # it from Netlify's secret scanner. PB_PASSWORD (the real secret) is NOT in the
  # repo and stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "PB_EMAIL"

# Serverless functions (e.g. gcal-feed: fetch + parse a Google Calendar .ics).
# The frontend stays dependency-free; the deps in package.json are used only here.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Basic security headers for all pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Always revalidate app assets so a deploy is picked up without a hard refresh.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
