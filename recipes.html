<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes — Master Chef</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .rhead { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
             padding: var(--sp-4) var(--sp-5); background: var(--surface); border-bottom: 1px solid var(--border);
             position: sticky; top: 0; z-index: 5; }
    .rhead h1 { font-size: 1.5rem; margin: 0; }
    .rnav { display: flex; gap: var(--sp-3); font-size: 1.4rem; }
    .rnav a { text-decoration: none; }
    .search { flex: 1; min-width: 150px; max-width: 320px; }
    #tagToggle.on { background: var(--green); border-color: var(--green); color: #fff; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: var(--sp-4) var(--sp-5) var(--sp-6); }

    /* Tag filter (collapsible) */
    .tagbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--sp-4);
              padding: var(--sp-3); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .tagbar[hidden] { display: none; }
    .tagchip { font-size: .8rem; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border);
               background: var(--surface); color: var(--text-muted); cursor: pointer; }
    .tagchip.active { background: var(--green); border-color: var(--green); color: #fff; }
    .tagclear { font-size: .8rem; color: var(--blue-dark); background: none; border: none; cursor: pointer; padding: 4px 6px; }
    .count { color: var(--text-faint); font-size: .82rem; margin-bottom: var(--sp-3); }

    /* Rows as separated buttons */
    .rlist { display: flex; flex-direction: column; gap: var(--sp-3); }
    .rrow { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-4);
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: var(--shadow); color: var(--text); cursor: pointer; transition: transform .1s, box-shadow .1s; }
    @media (hover: hover) { .rrow:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); } }
    .rmain { flex: 1; min-width: 0; }
    .rtitle { font-weight: 700; }
    .rtags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    .rtag { font-size: .7rem; background: var(--surface-2); color: var(--text-muted); padding: 1px 8px; border-radius: 999px; }
    .rmeta { text-align: right; flex: none; }
    .rtimes { color: var(--text-muted); font-size: .85rem; white-space: nowrap; }
    .rsource { color: var(--text-faint); font-size: .8rem; white-space: nowrap; }
    /* Edit only makes sense on touch (no hover to reveal, and desktop uses the row → edit page) */
    .redit { flex: none; color: var(--text-faint); text-decoration: none; font-size: 1.1rem; padding: 6px; display: none; }
    @media (hover: none) { .redit { display: inline-block; } }
    @media (max-width: 560px) { .rsource { display: none; } }
    .empty { text-align: center; color: var(--text-faint); padding: 3rem 0; }
  </style>
</head>
<body>
  <header class="rhead">
    <div class="rnav"><a href="hub.html" title="Hub">🏠</a><a href="planner.html" title="Meal planner">📅</a></div>
    <h1>Recipes</h1>
    <input class="input search" id="search" type="search" placeholder="Search recipes…">
    <button class="btn" id="tagToggle" aria-expanded="false">🏷 Tags</button>
    <a class="btn btn-primary" href="recipe-edit.html">＋ New recipe</a>
  </header>

  <div class="wrap">
    <div class="tagbar" id="tagbar" hidden></div>
    <div class="count" id="count"></div>
    <div class="rlist" id="list"><p class="empty">Loading…</p></div>
  </div>

  <script type="module">
    import { pb, requireAuth } from './scripts/auth.js';
    import { escapeHTML } from './scripts/utils.js';

    if (requireAuth()) init();
    let all = [];
    const activeTags = new Set();

    const domain = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };
    const sourceLabel = (r) => r.author || domain(r.source_url) || 'Cookbook';

    async function init() {
      try { all = await pb.collection('recipes').getFullList({ sort: 'title' }); }
      catch (e) { all = []; }
      renderTags();
      render();
      document.getElementById('search').addEventListener('input', render);
      const toggle = document.getElementById('tagToggle');
      toggle.addEventListener('click', () => {
        const bar = document.getElementById('tagbar');
        bar.hidden = !bar.hidden;
        toggle.setAttribute('aria-expanded', String(!bar.hidden));
      });
      document.getElementById('list').addEventListener('click', (e) => {
        if (e.target.closest('.redit')) return;
        const row = e.target.closest('.rrow');
        if (row) location.href = `recipe-view.html?id=${row.dataset.id}`;
      });
    }

    function updateTagButton() {
      const btn = document.getElementById('tagToggle');
      btn.textContent = activeTags.size ? `🏷 Tags (${activeTags.size})` : '🏷 Tags';
      btn.classList.toggle('on', activeTags.size > 0);
    }

    function renderTags() {
      const counts = {};
      for (const r of all) for (const t of (Array.isArray(r.tags) ? r.tags : [])) counts[t] = (counts[t] || 0) + 1;
      const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
      const bar = document.getElementById('tagbar');
      bar.innerHTML = tags.map(t =>
        `<button class="tagchip" data-tag="${escapeHTML(t)}">${escapeHTML(t)}</button>`).join('') +
        `<button class="tagclear" id="clearTags" hidden>Clear</button>`;
      bar.querySelectorAll('.tagchip').forEach(chip => chip.addEventListener('click', () => {
        const t = chip.dataset.tag;
        if (activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
        chip.classList.toggle('active', activeTags.has(t));
        document.getElementById('clearTags').hidden = activeTags.size === 0;
        updateTagButton();
        render();
      }));
      document.getElementById('clearTags').addEventListener('click', () => {
        activeTags.clear();
        bar.querySelectorAll('.tagchip').forEach(c => c.classList.remove('active'));
        document.getElementById('clearTags').hidden = true;
        updateTagButton();
        render();
      });
    }

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const list = all.filter(r => {
        const tags = Array.isArray(r.tags) ? r.tags : [];
        if (q && !(r.title || '').toLowerCase().includes(q)) return false;
        for (const t of activeTags) if (!tags.includes(t)) return false;
        return true;
      });

      document.getElementById('count').textContent =
        list.length === all.length ? `${all.length} recipes` : `Showing ${list.length} of ${all.length}`;

      const el = document.getElementById('list');
      if (!list.length) { el.innerHTML = '<p class="empty">No matching recipes.</p>'; return; }
      el.innerHTML = list.map(r => {
        const tags = (Array.isArray(r.tags) ? r.tags : []).slice(0, 5);
        const times = [r.prep_time && `Prep ${r.prep_time}`, r.cook_time && `Cook ${r.cook_time}`].filter(Boolean).join(' · ');
        return `<div class="rrow" data-id="${r.id}">
            <div class="rmain">
              <div class="rtitle">${escapeHTML(r.title)}</div>
              ${tags.length ? `<div class="rtags">${tags.map(t => `<span class="rtag">${escapeHTML(t)}</span>`).join('')}</div>` : ''}
            </div>
            <div class="rmeta">
              ${times ? `<div class="rtimes">${escapeHTML(times)}</div>` : ''}
              <div class="rsource">${escapeHTML(sourceLabel(r))}</div>
            </div>
            <a class="redit" href="recipe-edit.html?id=${r.id}" title="Edit">✎</a>
          </div>`;
      }).join('');
    }
  </script>
</body>
</html>
