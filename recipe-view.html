<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe — Master Chef</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .cook { max-width: 920px; margin: 0 auto; padding: var(--sp-5); }
    .cook-top { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); flex-wrap: wrap; }
    .iconbtn { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border);
               background: var(--surface); display: grid; place-items: center; font-size: 1.5rem;
               color: var(--text-muted); cursor: pointer; text-decoration: none; }
    .iconbtn:hover { background: var(--surface-2); color: var(--text); }
    .cook h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); margin-bottom: var(--sp-3); }
    .meta { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-5); }
    /* Stacked so sections can collapse cleanly at any width */
    .cook-grid { display: flex; flex-direction: column; gap: var(--sp-5); }

    .sec { font-family: var(--font-heading); font-size: 1.25rem; margin: 0 0 var(--sp-3);
           padding-bottom: var(--sp-2); border-bottom: 2px solid var(--green-soft);
           display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
           cursor: pointer; user-select: none; transition: color .15s; }
    .sec:hover { color: var(--green-dark); }
    .sec .chev { font-size: .85rem; color: var(--text-faint); transition: transform .2s; }
    .csec.collapsed .sec .chev { transform: rotate(-90deg); }
    .csec.collapsed .sec-body { display: none; }

    .ing-list, .step-list { list-style: none; margin: 0; padding: 0; }
    .ing-list { columns: 2; column-gap: var(--sp-6); }
    @media (max-width: 560px) { .ing-list { columns: 1; } }
    .ing { display: flex; align-items: flex-start; gap: var(--sp-3); padding: 11px 4px;
           border-bottom: 1px solid var(--surface-2); cursor: pointer; font-size: 1.05rem; break-inside: avoid; }
    .ing .box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border);
                margin-top: 1px; position: relative; transition: all .15s; }
    .ing.checked .box { background: var(--green); border-color: var(--green); }
    .ing.checked .box::after { content: ""; position: absolute; left: 7px; top: 3px; width: 5px; height: 10px;
                               border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg); }
    .ing.checked .txt { color: var(--text-faint); text-decoration: line-through; }

    .step { display: flex; gap: var(--sp-4); padding: 14px 0; font-size: 1.1rem; line-height: 1.55; cursor: pointer; }
    .step .num { flex: none; width: 34px; height: 34px; border-radius: 999px; background: var(--green-soft);
                 color: var(--green-dark); font-weight: 800; display: grid; place-items: center; font-size: 1rem;
                 position: relative; transition: background .15s; }
    .step.done .num { background: var(--green); color: transparent; }
    .step.done .num::after { content: ""; position: absolute; left: 12px; top: 8px; width: 7px; height: 13px;
                             border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg); }
    .step .txt { min-width: 0; }  /* let the flex text shrink/truncate instead of overflowing */
    .step.done .txt { opacity: .5; text-decoration: line-through; white-space: nowrap;
                      overflow: hidden; text-overflow: ellipsis; }  /* collapse completed */
    .amt { font-style: italic; color: var(--text-muted); }
    .cookmode.on { background: var(--green); border-color: var(--green); color: #fff; }
    .empty { color: var(--text-faint); text-align: center; padding: 3rem 0; }
  </style>
</head>
<body>
  <div class="cook" id="cook"><p class="empty">Loading…</p></div>

  <script type="module">
    import { pb, requireAuth } from './scripts/auth.js';
    import { escapeHTML } from './scripts/utils.js';

    if (requireAuth()) init();

    // ---- amount formatting / injection ----
    const UNIT_ABBR = { tablespoons: 'tbsp', tablespoon: 'tbsp', teaspoons: 'tsp', teaspoon: 'tsp',
                        ounces: 'oz', ounce: 'oz', pounds: 'lb', pound: 'lb' };
    const FRAC = { 0.25: '1/4', 0.33: '1/3', 0.34: '1/3', 0.5: '1/2', 0.66: '2/3', 0.67: '2/3',
                   0.75: '3/4', 0.2: '1/5', 0.13: '1/8', 0.38: '3/8', 0.63: '5/8', 0.88: '7/8' };
    function decToFrac(n) {
      if (n == null) return '';
      const whole = Math.floor(n), frac = +(n - whole).toFixed(2), f = FRAC[frac];
      if (frac === 0) return String(whole);
      if (f) return whole === 0 ? f : `${whole} ${f}`;
      return String(n);
    }
    function fmtAmt(ing) {
      return [decToFrac(ing.amount), ing.unit ? (UNIT_ABBR[ing.unit.toLowerCase()] || ing.unit) : '']
        .filter(Boolean).join(' ').trim();
    }
    // Insert "(amount)" in italics after the first mention of each ingredient in a step.
    function injectAmounts(stepText, ings) {
      let text = escapeHTML(stepText);
      const withAmt = ings.filter(i => i.name && (i.amount != null || i.unit))
        .sort((a, b) => b.name.length - a.name.length);
      const used = new Set();
      for (const ing of withAmt) {
        const amt = fmtAmt(ing);
        if (!amt || used.has(ing.name)) continue;
        const esc = ing.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`\\b(${esc})\\b`, 'i');
        if (re.test(text)) { text = text.replace(re, `$1 <span class="amt">(${amt})</span>`); used.add(ing.name); }
      }
      return text;
    }

    // Bold the leading measurement of an ingredient line ("1 cup", "3/4 cup"…).
    const boldAmount = (escaped) => escaped.replace(
      /^([\d½¼¾⅓⅔⅛⅜⅝⅞][\d\s/.\-½¼¾⅓⅔⅛⅜⅝⅞]*\s*(?:cups?|tablespoons?|tbsp\.?|teaspoons?|tsp\.?|ounces?|oz\.?|pounds?|lbs?\.?|grams?|g|ml|cloves?|cans?|sticks?|slices?)?\.?)\s/i,
      '<strong>$1</strong> ');

    async function init() {
      const el = document.getElementById('cook');
      const id = new URLSearchParams(location.search).get('id');
      if (!id) { el.innerHTML = '<p class="empty">No recipe specified.</p>'; return; }

      let r;
      try { r = await pb.collection('recipes').getOne(id); }
      catch (e) { el.innerHTML = '<p class="empty">Recipe not found.</p>'; return; }

      const ings = Array.isArray(r.ingredients) ? r.ingredients : [];
      const steps = Array.isArray(r.instructions) ? r.instructions : [];
      const tags = Array.isArray(r.tags) ? r.tags : [];
      const meta = [];
      if (r.servings) meta.push(`🍽 Serves ${r.servings}`);
      if (r.prep_time) meta.push(`⏱ Prep ${escapeHTML(r.prep_time)}`);
      if (r.cook_time) meta.push(`🔥 Cook ${escapeHTML(r.cook_time)}`);

      // Per-visit check state: kept on refresh, fresh on a new navigation to the page.
      const key = `cook:${id}`;
      const isReload = (performance.getEntriesByType('navigation')[0] || {}).type === 'reload';
      let state = { ings: [], steps: [] };
      if (isReload) { try { state = { ...state, ...JSON.parse(sessionStorage.getItem(key) || '{}') }; } catch {} }
      else sessionStorage.removeItem(key);
      const save = () => sessionStorage.setItem(key, JSON.stringify(state));

      // Prefer an explicit ?from= (reliable on mobile, where document.referrer is
      // often stripped to origin-only); then referrer; then the recipe list.
      const BACK = { hub: 'hub.html', planner: 'planner.html', recipes: 'recipes.html' };
      const from = new URLSearchParams(location.search).get('from');
      const backHref = BACK[from] || (document.referrer.includes('hub.html') ? 'hub.html' : 'recipes.html');
      el.innerHTML = `
        <div class="cook-top">
          <a class="iconbtn" href="${backHref}" aria-label="Back">‹</a>
          <button class="btn cookmode" id="cookMode" style="margin-left:auto">☀️ Cook Mode</button>
          <a class="btn" href="recipe-edit.html?id=${r.id}">Edit</a>
        </div>
        <h1>${escapeHTML(r.title)}</h1>
        <div class="meta">
          ${meta.map(m => `<span class="chip">${m}</span>`).join('')}
          ${tags.map(t => `<span class="chip">${escapeHTML(t)}</span>`).join('')}
        </div>
        <div class="cook-grid">
          <section class="csec" id="ingSec">
            <h2 class="sec">Ingredients <span class="chev">▾</span></h2>
            <div class="sec-body"><ul class="ing-list">
              ${ings.length ? ings.map((i, idx) =>
                `<li class="ing${state.ings.includes(idx) ? ' checked' : ''}" data-i="${idx}">
                   <span class="box"></span><span class="txt">${boldAmount(escapeHTML(i.raw || i.name || ''))}</span></li>`).join('')
                : '<li class="empty">No ingredients listed</li>'}
            </ul></div>
          </section>
          <section class="csec" id="stepSec">
            <h2 class="sec">Steps <span class="chev">▾</span></h2>
            <div class="sec-body"><ol class="step-list">
              ${steps.length ? steps.map((s, idx) =>
                `<li class="step${state.steps.includes(idx) ? ' done' : ''}" data-i="${idx}">
                   <span class="num">${s.step || idx + 1}</span>
                   <div class="txt">${injectAmounts(s.text || '', ings)}</div></li>`).join('')
                : '<li class="empty">No steps listed</li>'}
            </ol></div>
          </section>
        </div>`;

      // toggle ingredient checked
      el.querySelectorAll('.ing').forEach(li => li.addEventListener('click', () => {
        const i = +li.dataset.i;
        li.classList.toggle('checked');
        state.ings = li.classList.contains('checked') ? [...state.ings, i] : state.ings.filter(x => x !== i);
        save();
      }));
      // toggle step done (collapses)
      el.querySelectorAll('.step').forEach(li => li.addEventListener('click', () => {
        const i = +li.dataset.i;
        li.classList.toggle('done');
        state.steps = li.classList.contains('done') ? [...state.steps, i] : state.steps.filter(x => x !== i);
        save();
      }));
      // collapse sections (single-column only; header is only clickable there)
      el.querySelectorAll('.sec').forEach(h =>
        h.addEventListener('click', () => h.closest('.csec').classList.toggle('collapsed')));

      // Cook Mode — keep the screen awake while cooking (Wake Lock API)
      const cmBtn = document.getElementById('cookMode');
      if (!('wakeLock' in navigator)) {
        cmBtn.style.display = 'none';  // not supported (older browsers)
      } else {
        let wakeLock = null, cookWanted = false;
        const acquire = async () => { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} };
        cmBtn.addEventListener('click', async () => {
          cookWanted = !cookWanted;
          if (cookWanted) { await acquire(); cmBtn.classList.add('on'); cmBtn.textContent = '☀️ Cook Mode on'; }
          else { if (wakeLock) { try { await wakeLock.release(); } catch {} } wakeLock = null;
                 cmBtn.classList.remove('on'); cmBtn.textContent = '☀️ Cook Mode'; }
        });
        // the lock auto-releases when the tab is hidden; re-acquire when it returns
        document.addEventListener('visibilitychange', async () => {
          if (cookWanted && document.visibilityState === 'visible') await acquire();
        });
      }
    }
  </script>
</body>
</html>
