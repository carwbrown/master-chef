<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Chef - Recipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f2ed;
      min-height: 100vh;
    }

    header {
      background: #faf8f5;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e8e4df;
    }

    .logo {
      font-family: 'Crimson Text', Georgia, serif;
      font-size: 1.5rem;
      color: #2c1810;
    }

    nav { display: flex; gap: 1rem; align-items: center; }

    nav a {
      color: #5c4a3d;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
    }

    nav a:hover { background: rgba(139, 115, 85, 0.1); }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    .recipe-header {
      margin-bottom: 2rem;
    }

    h1 {
      font-family: 'Crimson Text', Georgia, serif;
      color: #2c1810;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .recipe-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      color: #5c4a3d;
      font-size: 0.95rem;
    }

    .recipe-meta span {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .tag {
      background: rgba(139, 115, 85, 0.15);
      color: #5c4a3d;
      padding: 0.25rem 0.75rem;
      border-radius: 100px;
      font-size: 0.875rem;
    }

    .recipe-section {
      background: #faf8f5;
      border: 1px solid #e8e4df;
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .recipe-section h2 {
      font-family: 'Crimson Text', Georgia, serif;
      color: #2c1810;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #e8e4df;
    }

    .ingredients-list {
      list-style: none;
    }

    .ingredients-list li {
      padding: 0.75rem 0;
      border-bottom: 1px solid #e8e4df;
      color: #2c1810;
    }

    .ingredients-list li:last-child {
      border-bottom: none;
    }

    .ingredients-list li::before {
      content: "•";
      color: #8b7355;
      margin-right: 0.75rem;
    }

    .instructions-list {
      list-style: none;
      counter-reset: step;
    }

    .instructions-list li {
      padding: 1rem 0;
      padding-left: 3rem;
      position: relative;
      border-bottom: 1px solid #e8e4df;
      color: #2c1810;
      line-height: 1.6;
    }

    .instructions-list li:last-child {
      border-bottom: none;
    }

    .instructions-list li::before {
      counter-increment: step;
      content: counter(step);
      position: absolute;
      left: 0;
      top: 1rem;
      width: 2rem;
      height: 2rem;
      background: #2c1810;
      color: #faf8f5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.875rem;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #8b7355;
      text-decoration: none;
      font-size: 0.95rem;
      margin-top: 1rem;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: #2c1810;
      border: none;
      color: #faf8f5;
    }

    .btn-primary:hover { background: #3d2518; }

    .btn-secondary {
      background: transparent;
      border: 1px solid #8b7355;
      color: #8b7355;
    }

    .btn-secondary:hover {
      background: rgba(139, 115, 85, 0.1);
    }

    .btn-danger {
      background: transparent;
      border: 1px solid #c0392b;
      color: #c0392b;
    }

    .btn-danger:hover {
      background: rgba(192, 57, 43, 0.1);
    }

    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: #5c4a3d;
    }

    .error {
      text-align: center;
      padding: 4rem 2rem;
      color: #c0392b;
    }

    @media (max-width: 600px) {
      main { padding: 1rem; }
      h1 { font-size: 2rem; }
      .recipe-meta { gap: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Master Chef</div>
    <nav>
      <a href="/recipes.html">Back to Recipes</a>
    </nav>
  </header>

  <main>
    <div id="content">
      <div class="loading">Loading recipe...</div>
    </div>
  </main>

  <script type="module">
    import { requireAuth, getCurrentUser, pb } from './scripts/auth.js';

    // Check auth
    if (!requireAuth()) return;

    const user = getCurrentUser();
    const content = document.getElementById('content');

    // Get recipe ID from URL
    const params = new URLSearchParams(window.location.search);
    const recipeId = params.get('id');

    if (!recipeId) {
      content.innerHTML = `
        <div class="error">
          <p>No recipe specified.</p>
          <a href="/recipes.html" class="btn btn-secondary" style="margin-top: 1rem; display: inline-block;">Back to Recipes</a>
        </div>
      `;
    } else {
      loadRecipe(recipeId);
    }

    async function loadRecipe(id) {
      try {
        const recipe = await pb.collection('recipes').getOne(id);

        // Check if user owns this recipe
        const isOwner = recipe.user === user.id;

        // Parse arrays if stored as JSON strings
        let ingredients = recipe.ingredients || [];
        let instructions = recipe.instructions || [];

        if (typeof ingredients === 'string') {
          try { ingredients = JSON.parse(ingredients); } catch (e) { ingredients = []; }
        }
        if (typeof instructions === 'string') {
          try { instructions = JSON.parse(instructions); } catch (e) { instructions = []; }
        }

        // Parse tags
        let tags = [];
        if (recipe.tags) {
          tags = recipe.tags.split(',').map(t => t.trim()).filter(Boolean);
        }

        document.title = `${recipe.title} - Master Chef`;

        content.innerHTML = `
          <div class="recipe-header">
            <h1>${escapeHtml(recipe.title)}</h1>
            <div class="recipe-meta">
              ${recipe.prep_time ? `<span>Prep: ${escapeHtml(recipe.prep_time)}</span>` : ''}
              ${recipe.cook_time ? `<span>Cook: ${escapeHtml(recipe.cook_time)}</span>` : ''}
              ${recipe.servings ? `<span>Servings: ${escapeHtml(recipe.servings)}</span>` : ''}
            </div>
            ${tags.length > 0 ? `
              <div class="tags">
                ${tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
              </div>
            ` : ''}
          </div>

          ${ingredients.length > 0 ? `
            <div class="recipe-section">
              <h2>Ingredients</h2>
              <ul class="ingredients-list">
                ${ingredients.map(ing => `<li>${escapeHtml(ing)}</li>`).join('')}
              </ul>
            </div>
          ` : ''}

          ${instructions.length > 0 ? `
            <div class="recipe-section">
              <h2>Instructions</h2>
              <ol class="instructions-list">
                ${instructions.map(step => `<li>${escapeHtml(step)}</li>`).join('')}
              </ol>
            </div>
          ` : ''}

          ${recipe.source_url ? `
            <a href="${escapeHtml(recipe.source_url)}" target="_blank" rel="noopener" class="source-link">
              View Original Recipe
            </a>
          ` : ''}

          ${isOwner ? `
            <div class="actions">
              <a href="/recipe-edit.html?id=${recipe.id}" class="btn btn-secondary">Edit Recipe</a>
              <button class="btn btn-danger" id="delete-btn">Delete Recipe</button>
            </div>
          ` : ''}
        `;

        // Delete handler
        if (isOwner) {
          document.getElementById('delete-btn')?.addEventListener('click', async () => {
            if (confirm('Are you sure you want to delete this recipe?')) {
              try {
                await pb.collection('recipes').delete(id);
                window.location.href = '/recipes.html';
              } catch (error) {
                alert('Failed to delete recipe: ' + error.message);
              }
            }
          });
        }

      } catch (error) {
        console.error('Error loading recipe:', error);
        content.innerHTML = `
          <div class="error">
            <p>Could not load recipe.</p>
            <p style="font-size: 0.875rem; margin-top: 0.5rem;">${error.message}</p>
            <a href="/recipes.html" class="btn btn-secondary" style="margin-top: 1rem; display: inline-block;">Back to Recipes</a>
          </div>
        `;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
