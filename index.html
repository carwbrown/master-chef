<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Chef — Family Hub</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { visibility: hidden; } /* revealed by script to avoid a redirect flash */
    .landing {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 2rem;
      background: linear-gradient(165deg, var(--blue-soft) 0%, var(--bg) 48%, var(--green-soft) 100%);
    }
    .scene { width: min(340px, 74vw); height: auto; margin-bottom: 2.25rem; }
    .landing h1 { font-size: clamp(2.1rem, 6vw, 3.1rem); margin-bottom: .35rem; }
    .landing p { color: var(--text-muted); font-size: 1.1rem; margin: 0 0 2.25rem; }
    .enter { font-size: 1.05rem; padding: .9rem 2.25rem; text-decoration: none; }
  </style>
</head>
<body>
  <main class="landing">
    <svg class="scene" viewBox="0 0 260 200" fill="none" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="A cozy house beside a potted plant">
      <!-- sun -->
      <circle cx="214" cy="42" r="18" fill="#F2D48A"/>
      <!-- clouds -->
      <ellipse cx="58" cy="40" rx="26" ry="11" fill="#ffffff" opacity=".9"/>
      <ellipse cx="80" cy="45" rx="18" ry="9" fill="#ffffff" opacity=".9"/>
      <!-- hills -->
      <path d="M0 150 Q90 120 260 148 L260 200 L0 200 Z" fill="#BEDBBF"/>
      <path d="M0 168 Q130 152 260 174 L260 200 L0 200 Z" fill="#a9cdb0"/>
      <!-- house -->
      <rect x="92" y="100" width="76" height="64" rx="8" fill="#ffffff" stroke="#d6e3dd" stroke-width="2"/>
      <path d="M84 102 L130 70 L176 102 Z" fill="#4a90b8"/>
      <rect x="120" y="128" width="20" height="36" rx="4" fill="#4f9d69"/>
      <circle cx="135" cy="146" r="1.6" fill="#dcebe1"/>
      <rect x="146" y="116" width="16" height="16" rx="3" fill="#dbeaf2" stroke="#4a90b8" stroke-width="1.5"/>
      <!-- potted plant -->
      <path d="M198 150 q4 -22 0 -34" stroke="#3d7a52" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M198 122 q-15 -3 -21 -17 q16 -2 21 14 Z" fill="#4f9d69"/>
      <path d="M198 126 q15 -5 20 -18 q-16 0 -20 14 Z" fill="#5faf78"/>
      <path d="M188 150 h20 l-3 15 h-14 Z" fill="#E9BABA"/>
    </svg>
    <h1>Master Chef</h1>
    <p>The family hub</p>
    <a class="btn btn-primary enter" href="login.html">Sign in</a>
  </main>

  <script type="module">
    import { isAuthenticated } from './scripts/auth.js';
    if (isAuthenticated()) {
      window.location.replace('hub.html');
    } else {
      document.body.style.visibility = 'visible';
    }
  </script>
</body>
</html>
