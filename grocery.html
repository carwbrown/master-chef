<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery — Master Chef</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="grocery.css">
</head>
<body>
  <header class="rhead">
    <div class="rnav" id="navMount"></div>
    <h1>Grocery</h1>
  </header>

  <div class="wrap">
    <!-- This trip -->
    <section class="gsection">
      <div class="ghead">
        <h2>This trip</h2>
        <div class="gactions">
          <button class="btn" id="clearPurchased" type="button" hidden></button>
        </div>
      </div>
      <ul class="glist trip" id="tripList"></ul>
      <form class="gadd" id="tripForm">
        <input class="input gadd-name" type="text" placeholder="Add a one-off item…" required>
        <input class="input gadd-qty" type="text" placeholder="Qty">
        <button class="btn btn-primary" type="submit">Add</button>
      </form>
    </section>
  </div>

  <script type="module">
    import { requireAuth } from './scripts/auth.js';
    import { mountMenu } from './scripts/nav.js';
    import { initGroceryList } from './scripts/grocery.js';

    if (requireAuth()) init();

    function init() {
      mountMenu(document.getElementById('navMount'), 'grocery');
      const clearBtn = document.getElementById('clearPurchased');
      const list = initGroceryList({
        list: 'adhoc',
        listEl: document.getElementById('tripList'),
        formEl: document.getElementById('tripForm'),
        emptyText: 'Nothing on this trip. Add one-off items here.',
        sinkChecked: true,
        onRender: (items) => {
          const bought = items.filter(i => i.checked).length;
          clearBtn.hidden = bought === 0;
          clearBtn.textContent = `Clear purchased (${bought})`;
        },
      });
      clearBtn.addEventListener('click', () => list.removeChecked());
      list.refresh();
    }
  </script>
</body>
</html>
