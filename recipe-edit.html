<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit recipe — Master Chef</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .wrap { max-width: 720px; margin: 0 auto; padding: var(--sp-5); }
    .top { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); }
    .iconbtn { width: 42px; height: 42px; border-radius: 999px; border: 1px solid var(--border);
               background: var(--surface); display: grid; place-items: center; font-size: 1.4rem;
               color: var(--text-muted); cursor: pointer; text-decoration: none; }
    h1 { font-size: 1.5rem; margin: 0; }
    form { display: flex; flex-direction: column; gap: var(--sp-4); }
    label { display: block; font-size: .85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .row { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 120px; }
    textarea { resize: vertical; }
    .hint { font-size: .78rem; color: var(--text-faint); margin-top: 4px; }
    .jsonbox { background: var(--surface-2); border-radius: var(--radius); padding: var(--sp-3); }
    .jsonbox summary { cursor: pointer; font-weight: 600; color: var(--text-muted); font-size: .9rem; }
    .actions { display: flex; align-items: center; gap: var(--sp-2); }
    .btn.danger { color: var(--danger); border-color: var(--danger-soft); }
    .ing-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--sp-2); margin-bottom: 6px; }
    .ing-meta { display: flex; gap: 6px; margin-top: 6px; }
    .ing-meta .ing-amt { width: 62px; flex: none; }
    .ing-meta .ing-unit { width: 92px; flex: none; }
    .ing-meta .ing-name { flex: 1; min-width: 0; }
    .ing-del { flex: none; border: none; background: none; color: var(--text-faint); cursor: pointer; font-size: 1rem; padding: 0 8px; }
    .ing-del:hover { color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <button class="iconbtn" onclick="history.back()" aria-label="Back">‹</button>
      <h1 id="pageTitle">New recipe</h1>
    </div>

    <form id="form">
      <details class="jsonbox">
        <summary>Paste recipe JSON (from the recipe-to-json skill)</summary>
        <p class="hint">Paste JSON in the canonical format and click Fill to populate the fields below.</p>
        <textarea id="jsonIn" rows="4" placeholder='{ "title": "...", "ingredients": [...], "instructions": [...] }'></textarea>
        <button type="button" class="btn" id="fillBtn" style="margin-top:8px">Fill from JSON</button>
      </details>

      <div><label>Title</label><input type="text" name="title" required></div>
      <div class="row">
        <div><label>Servings</label><input type="number" name="servings" min="0"></div>
        <div><label>Prep time</label><input type="text" name="prep_time" placeholder="15 min"></div>
        <div><label>Cook time</label><input type="text" name="cook_time" placeholder="30 min"></div>
      </div>
      <div><label>Source URL</label><input type="url" name="source_url" placeholder="https://…"></div>
      <div><label>Author / source <span class="hint">(person, site, or cookbook)</span></label><input type="text" name="author" placeholder="e.g. Half Baked Harvest"></div>
      <div><label>Tags <span class="hint">(comma-separated)</span></label><input type="text" name="tags" placeholder="italian, dinner, quick"></div>
      <div>
        <label>Ingredients <span class="hint">(amount &amp; name drive the amounts shown in the steps)</span></label>
        <div id="ingRows"></div>
        <button type="button" class="btn" id="addIng" style="margin-top:6px">＋ Add ingredient</button>
      </div>
      <div><label>Steps <span class="hint">(one per line)</span></label>
        <textarea name="instructions" rows="8" placeholder="Bring a pot of salted water to a boil.&#10;…"></textarea></div>

      <div class="actions">
        <button type="button" class="btn danger" id="deleteBtn" hidden>Delete</button>
        <span style="flex:1"></span>
        <button type="button" class="btn" onclick="history.back()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script type="module">
    import { pb, requireAuth } from './scripts/auth.js';
    import { parseIngredient } from './scripts/ingredient-parser.js';
    if (!requireAuth()) { /* redirected */ }

    const form = document.getElementById('form');
    const ingRows = document.getElementById('ingRows');
    const id = new URLSearchParams(location.search).get('id');

    const mk = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
    function addIngRow(ing = {}) {
      const row = mk('div', 'ing-row');
      const raw = mk('input', 'ing-raw'); raw.type = 'text'; raw.placeholder = '1 cup low-sodium soy sauce'; raw.value = ing.raw || '';
      const meta = mk('div', 'ing-meta');
      const amt = mk('input', 'ing-amt'); amt.type = 'text'; amt.inputMode = 'decimal'; amt.placeholder = 'amt'; amt.value = ing.amount != null ? ing.amount : '';
      const unit = mk('input', 'ing-unit'); unit.type = 'text'; unit.placeholder = 'unit'; unit.value = ing.unit || '';
      const name = mk('input', 'ing-name'); name.type = 'text'; name.placeholder = 'name'; name.value = ing.name || '';
      const del = mk('button', 'ing-del'); del.type = 'button'; del.title = 'Remove'; del.textContent = '✕';
      del.onclick = () => row.remove();
      raw.addEventListener('blur', () => {           // auto-fill structured fields from the raw line
        if (raw.value && !amt.value && !unit.value && !name.value) {
          const p = parseIngredient(raw.value);
          amt.value = p.amount != null ? p.amount : ''; unit.value = p.unit || ''; name.value = p.name || '';
        }
      });
      meta.append(amt, unit, name, del);
      row.append(raw, meta);
      ingRows.appendChild(row);
    }
    document.getElementById('addIng').addEventListener('click', () => addIngRow());

    if (id) init(); else addIngRow();

    async function init() {
      let r;
      try { r = await pb.collection('recipes').getOne(id); } catch (e) { alert('Recipe not found'); return; }
      document.getElementById('pageTitle').textContent = 'Edit recipe';
      document.getElementById('deleteBtn').hidden = false;
      document.getElementById('deleteBtn').onclick = onDelete;
      form.title.value = r.title || '';
      form.servings.value = r.servings ?? '';
      form.prep_time.value = r.prep_time || '';
      form.cook_time.value = r.cook_time || '';
      form.source_url.value = r.source_url || '';
      form.author.value = r.author || '';
      form.tags.value = (Array.isArray(r.tags) ? r.tags : []).join(', ');
      const ings = Array.isArray(r.ingredients) ? r.ingredients : [];
      ings.length ? ings.forEach(addIngRow) : addIngRow();
      form.instructions.value = (Array.isArray(r.instructions) ? r.instructions : []).map(s => s.text || '').join('\n');
    }

    // Fill fields from pasted canonical JSON
    document.getElementById('fillBtn').addEventListener('click', () => {
      let data;
      try { data = JSON.parse(document.getElementById('jsonIn').value); }
      catch (e) { alert('That is not valid JSON.'); return; }
      form.title.value = data.title || '';
      form.servings.value = data.servings ?? '';
      form.prep_time.value = data.prep_time || '';
      form.cook_time.value = data.cook_time || '';
      form.source_url.value = data.source_url || '';
      form.author.value = data.author || '';
      form.tags.value = (Array.isArray(data.tags) ? data.tags : []).join(', ');
      ingRows.innerHTML = '';
      (Array.isArray(data.ingredients) ? data.ingredients : []).forEach(i =>
        typeof i === 'string' ? addIngRow({ raw: i, ...parseIngredient(i) }) : addIngRow(i));
      if (!ingRows.children.length) addIngRow();
      form.instructions.value = (Array.isArray(data.instructions) ? data.instructions : []).map(s => s.text || s).join('\n');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const lines = (v) => v.split('\n').map(s => s.trim()).filter(Boolean);
      const payload = {
        title: form.title.value.trim(),
        servings: form.servings.value ? Number(form.servings.value) : null,
        prep_time: form.prep_time.value.trim(),
        cook_time: form.cook_time.value.trim(),
        source_url: form.source_url.value.trim(),
        author: form.author.value.trim(),
        tags: form.tags.value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
        ingredients: [...ingRows.querySelectorAll('.ing-row')].map(row => {
          const raw = row.querySelector('.ing-raw').value.trim();
          const amtV = row.querySelector('.ing-amt').value.trim();
          const unit = row.querySelector('.ing-unit').value.trim();
          const nm = row.querySelector('.ing-name').value.trim();
          return { raw, amount: amtV !== '' ? Number(amtV) : null, unit: unit || null, name: nm || raw.toLowerCase() };
        }).filter(i => i.raw),
        instructions: lines(form.instructions.value).map((text, i) => ({ step: i + 1, text })),
      };
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const saved = id ? await pb.collection('recipes').update(id, payload)
                         : await pb.collection('recipes').create(payload);
        location.href = `recipe-view.html?id=${saved.id}`;
      } catch (err) { alert('Could not save: ' + (err?.message || err)); btn.disabled = false; }
    });

    async function onDelete() {
      if (!confirm('Delete this recipe?')) return;
      try { await pb.collection('recipes').delete(id); location.href = 'recipes.html'; }
      catch (err) { alert('Could not delete: ' + (err?.message || err)); }
    }
  </script>
</body>
</html>
