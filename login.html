<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Master Chef</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .auth-wrap {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
      background: linear-gradient(165deg, var(--blue-soft) 0%, var(--bg) 50%, var(--green-soft) 100%);
    }
    .brand {
      font-family: var(--font-heading); font-weight: 800; font-size: 1.6rem;
      color: var(--text); margin-bottom: 1.5rem;
    }
    .back { margin-top: 1.5rem; font-size: .9rem; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="brand">Master Chef</div>
    <login-form></login-form>
    <a class="back muted" href="index.html">← Back</a>
  </div>

  <script type="module" src="components/login-form.js"></script>
  <script type="module">
    import { isAuthenticated } from './scripts/auth.js';
    if (isAuthenticated()) window.location.replace('hub.html');
  </script>
</body>
</html>
